<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The tab icon is an emoji, drawn by the system emoji font rather than by
       hand, the same way every other icon on the site works.

       Positioned with an explicit baseline and text-anchor rather than
       dominant-baseline: browsers honour that inconsistently on a bare
       <text>, and the glyph ends up clipped at the edges. -->
  <text x="50" y="72" font-size="66" text-anchor="middle">🖌️</text>
</svg>
